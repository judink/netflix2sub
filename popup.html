<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>함께 자막</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <header><div class="badge">KO <span>+</span> UK</div><h1>함께 자막</h1><p>같은 장면, 두 사람의 언어.</p></header>
  <main>
    <label class="switch"><span>우크라이나어 번역 켜기</span><input type="checkbox" id="enabled"></label>
    <p class="hint">한국어 자막 파일을 읽고, 재생 위치부터 미리 번역합니다. 켜면 현재 작품의 자막을 순차적으로 DeepSeek에 전송하며 API 요금이 발생합니다.</p>
    <form id="settings">
      <label for="apiKey">DeepSeek API 키</label>
      <div class="key-row"><input id="apiKey" type="password" autocomplete="off" placeholder="sk-…"><button type="button" id="reveal" aria-label="API 키 보기">보기</button></div>
      <p class="hint">키는 이 Chrome 프로필에만 저장됩니다. 자막과 번역 요청은 DeepSeek로 전송됩니다.</p>
      <label for="model">번역 모델</label><select id="model"><option value="deepseek-flash">DeepSeek Flash</option><option value="deepseek-v4-pro">DeepSeek V4 Pro</option></select>
      <div class="sliders"><label for="fontSize">글자 크기 <output id="fontValue">28px</output></label><input id="fontSize" type="range" min="16" max="52" value="28"><label for="top">화면 위에서 거리 <output id="topValue">4%</output></label><input id="top" type="range" min="0" max="25" value="4"></div>
      <div class="buttons"><button type="submit" class="primary">설정 저장</button><button id="test" type="button">연결 테스트</button></div>
    </form>
    <p id="feedback" role="status" aria-live="polite"></p>
    <section class="progress"><div class="progress-title"><span>현재 작품</span><button id="retry" type="button">다시 시도</button></div><p id="status">넷플릭스 탭 확인 중…</p><progress id="progress" value="0" max="1"></progress></section>
    <p class="hint">한국어는 아래, 우크라이나어는 위에 표시됩니다. 현재 대사부터 먼저 번역하며, 다음 화로 넘어가면 자동으로 새 자막 번역을 시작합니다.</p>
  </main><script src="popup.js"></script>
</body></html>
